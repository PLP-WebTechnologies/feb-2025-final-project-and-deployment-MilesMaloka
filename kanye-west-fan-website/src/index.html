<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendrick Lamar Fan Website</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Kendrick Lamar Fan Website</h1>
      <nav>
        <ul>
          <li><a href="#albums">Albums</a></li>
          <li><a href="#songs">Songs</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="albums">
      <h2>Albums</h2>
      <div class="album-list">
        <!-- Example album cards -->
        <div class="card">
          <img src="images/GNX.jpg" alt="GNX Album Cover">
          <h3>GNX (2024)</h3>
        </div>
        <div class="card">
          <img src="assets/kendrick.jpg" alt="Mr. Morale & the Big Steppers Album Cover">
          <h3>Mr. Morale & the Big Steppers(2022)</h3>
        </div>
        <div class="card">
          <img src="assets/TPAB.jpg" alt="To Pimp a Butterfly Album Cover">
          <h3>DAMN. (2017)</h3>
        </div>
        <div class="card">
          <img src="assets/kendrick.jpg" alt="To Pimp a Butterfly Album Cover">
          <h3>To Pimp a Butterfly (2015)</h3>
        </div>
        <div class="card">
          <img src="assets/kendrick.jpg" alt="To Pimp a Butterfly Album Cover">
          <h3>Good Kid, M.A.A.D City (2013)</h3>
        </div>
      </div>
    </section>

    <section id="songs">
      <h2>Popular Songs</h2>
      <ul class="song-list">
        <li>HUMBLE.</li>
        <li>Alright</li>
        <li>DNA.</li>
        <li>Money Trees</li>
      </ul>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Kendrick Lamar Fan Website</p>
    </div>
  </footer>

  <script src="scripts/app.js"></script>
</body>
</html>
